<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <meta name="description"
        content="A photographic study of reflections in shop windows.">
  <title>Reflections | Alain Mauri</title>
  <link rel="stylesheet" href="/assets/css/reflections.css">
</head>
<body>
  
  <main class="exhibition" id="top">
    <header class="exhibition-header">
      <p class="exhibition-kicker">A photographic exhibition</p>
      <h1>Reflections</h1>
      <p class="exhibition-intro">A small study of shop windows, objects and the streets of Sheffield reflected in glass.</p>
    </header>

    
      <figure class="photo" id="photo-1">
      <img
        src="/assets/photography/reflections/ghosts.jpg"
        alt="Three ghost-like figures dressed in white behind a shop window, their faces covered by different masks, with buildings and the street reflected across the glass."
        
          width="5488"
          height="3660"
        
        loading="eager"
        decoding="async">
        <figcaption>
          <span class="photo-title">Ghosts</span>
          <span class="photo-meta">Canon EOS 80D / Canon EF 40mm / Digital</span>
          
        </figcaption>
      </figure>
    
      <figure class="photo" id="photo-2">
      <img
        src="/assets/photography/reflections/zebra.jpg"
        alt="A striped ceramic zebra among household objects behind a shop window, with faint street reflections across the glass."
        
          width="3130"
          height="2075"
        
        loading="lazy"
        decoding="async">
        <figcaption>
          <span class="photo-title">Zen</span>
          <span class="photo-meta">Canon EOS 300V / Canon EF 50mm / Agfa APX 400</span>
          
        </figcaption>
      </figure>
    
      <figure class="photo" id="photo-3">
      <img
        src="/assets/photography/reflections/mannequins.jpg"
        alt="Two mannequins in colourful clothes and hats behind glass, overlaid with reflections of buildings and red street lights."
        
          width="3130"
          height="2075"
        
        loading="lazy"
        decoding="async">
        <figcaption>
          <span class="photo-title">Together</span>
          <span class="photo-meta">Canon EOS 300V / Canon EF 50mm / Expired Fujifilm Superia X-TRA 400</span>
          
        </figcaption>
      </figure>
    
      <figure class="photo" id="photo-4">
      <img
        src="/assets/photography/reflections/typewriter.jpg"
        alt="An old typewriter sitting on top of two vintage leather suitcases, with floral arrangements beside it."
        
          width="3130"
          height="2075"
        
        loading="lazy"
        decoding="async">
        <figcaption>
          <span class="photo-title">Writing Stories</span>
          <span class="photo-meta">Canon EOS 300V / Canon EF 50mm / Agfa APX 400</span>
          
        </figcaption>
      </figure>
    
      <figure class="photo" id="photo-5">
      <img
        src="/assets/photography/reflections/bus_stop.jpg"
        alt="Shop windows visible through the glass of a bus stop, which is decorated with yellow dots."
        
          width="3130"
          height="2075"
        
        loading="lazy"
        decoding="async">
        <figcaption>
          <span class="photo-title">Through the Glass</span>
          <span class="photo-meta">Canon EOS 300V / Canon EF 50mm / Expired Fujifilm Superia X-TRA 400</span>
          
        </figcaption>
      </figure>
    
      <figure class="photo" id="photo-6">
      <img
        src="/assets/photography/reflections/waiting_for.jpg"
        alt="A woman sitting at a bus stop, seen through the glass, with her back reflected in another glass panel."
        
          width="1694"
          height="2556"
        
        loading="lazy"
        decoding="async">
        <figcaption>
          <span class="photo-title">Waiting for...</span>
          <span class="photo-meta">Canon EOS 300V / Canon EF 50mm / Agfa APX 400</span>
          
        </figcaption>
      </figure>
    
      <figure class="photo" id="photo-7">
      <img
        src="/assets/photography/reflections/marriage.jpeg"
        alt="Two mannequins dressed as a bride and groom behind a shop window, with a street, buildings, cars and traffic lights reflected across the glass."
        
          width="3130"
          height="2075"
        
        loading="lazy"
        decoding="async">
        <figcaption>
          <span class="photo-title">The Bride and Groom</span>
          <span class="photo-meta">Pentax ME Super / Pentax-M 50mm / Expired Fujifilm Superia X-TRA 400</span>
          
        </figcaption>
      </figure>
    
      <figure class="photo" id="photo-8">
      <img
        src="/assets/photography/reflections/cuddling.jpg"
        alt="A mannequin wearing pyjamas and a hat, cuddling a plastic doll behind glass."
        
          width="2075"
          height="3130"
        
        loading="lazy"
        decoding="async">
        <figcaption>
          <span class="photo-title">Cuddling</span>
          <span class="photo-meta">Canon EOS 300V / Canon EF 50mm / Expired Fujifilm Superia X-TRA 400</span>
          
        </figcaption>
      </figure>
    
      <figure class="photo" id="photo-9">
      <img
        src="/assets/photography/reflections/yellow_chair.jpeg"
        alt="Two stacked yellow plastic chairs on a table behind glass, with a passer-by reflected in the window."
        
          width="3759"
          height="5617"
        
        loading="lazy"
        decoding="async">
        <figcaption>
          <span class="photo-title">On the Yellow Chair</span>
          <span class="photo-meta">Canon EOS 80D / Canon EF 40mm / Digital</span>
          
        </figcaption>
      </figure>
    
      <figure class="photo" id="photo-10">
      <img
        src="/assets/photography/reflections/books.jpg"
        alt="Books on a table behind a shop window, overlaid with reflections of buildings and cars."
        
          width="3130"
          height="2075"
        
        loading="lazy"
        decoding="async">
        <figcaption>
          <span class="photo-title">Among the Books</span>
          <span class="photo-meta">Canon EOS 300V / Canon EF 50mm / Expired Fujifilm Superia X-TRA 400</span>
          
        </figcaption>
      </figure>
    
      <figure class="photo" id="photo-11">
      <img
        src="/assets/photography/reflections/flower_shop.jpg"
        alt="A dried flower behind glass, overlaid with reflections of blue and red street lights."
        
          width="3669"
          height="5500"
        
        loading="lazy"
        decoding="async">
        <figcaption>
          <span class="photo-title">Flowers and Lights</span>
          <span class="photo-meta">Canon EOS 80D / Canon EF 50mm / Digital</span>
          
        </figcaption>
      </figure>
    

    <footer class="exhibition-footer">
      <span>© 2026 Alain Mauri</span>
      <a href="#top">Back to top ↑</a>
    </footer>
  </main>
</body>
</html>
